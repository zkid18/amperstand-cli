[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amperstand"
version = "0.2.0"
description = "Thin HTTP client for an amperstand-core vault server."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
amperstand = "amperstand.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amperstand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
